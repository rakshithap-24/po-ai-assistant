_schema-version: 3.3.0
ID: ai_purchase_order_assistant
description: AI-powered purchase order assistant
version: 1.0.0
modules:
  - name: ai_purchase_order_assistant-approuter
    type: nodejs
    path: approuter
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: ai_purchase_order_assistant-auth
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: ai_purchase_order_assistant-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: ai_purchase_order_assistant-db
      - name: ai_purchase_order_assistant-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: ai_purchase_order_assistant-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: ai_purchase_order_assistant-db
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}
    parameters:
      buildpack: nodejs_buildpack
resources:
  - name: ai_purchase_order_assistant-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: ${service-name}
  - name: ai_purchase_order_assistant-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ai_purchase_order_assistant-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npm run build:ui
