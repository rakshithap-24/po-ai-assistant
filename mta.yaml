_schema-version: 3.3.0
ID: ai_purchase_order_assistant
description: A simple CAP project.
version: 1.0.0
modules:
- name: ai_purchase_order_assistant-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: ai_purchase_order_assistant-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: ai_purchase_order_assistant-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: ai_purchase_order_assistant-db
    properties:
      TARGET_CONTAINER: ~{hdi-container-name}
  parameters:
    buildpack: nodejs_buildpack
resources:
- name: ai_purchase_order_assistant-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
  properties:
    hdi-container-name: ${service-name}
- name: cross-container-service-1
  type: deleteme
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
